
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Rina & Saki Journal — 浜松の素敵なお店をふたりでめぐるカフェジャーナル。">
  <meta name="theme-color" content="#f8f5f2">
  <title>Rina &amp; Saki Journal | 浜松の素敵なお店めぐり</title>

  <!-- CSSもこのHTMLファイルの中にまとめています。 -->
  <style>
/*
 * Rina & Saki Journal
 * HTML + CSSのみで制作 / JavaScript不使用
 * 画像：pict/top-pict.jpg、pict/rina-saki.png、pict/bonheur/bonheur05.jpg
 */
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Mrs+Saint+Delafield&family=Noto+Serif+JP:wght@400;500&display=swap');

:root {
  --paper: #f8f5f2;
  --paper-deep: #f4eeea;
  --ink: #604d43;
  --rose-brown: #a88b7f;
  --rose-brown-hover: #937568;
  --font-serif: 'Cormorant Garamond', 'Times New Roman', Georgia, serif;
  --font-script: 'Mrs Saint Delafield', 'Snell Roundhand', 'Apple Chancery', 'Z003', cursive;
  --font-japanese: 'Noto Serif JP', 'Yu Mincho', 'Hiragino Mincho ProN', serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

a {
  color: inherit;
  text-decoration: none;
}

a:focus-visible {
  outline: 3px solid #734d3f;
  outline-offset: 5px;
}

/* ─── Header ─── */
.site-header {
  position: relative;
  z-index: 10;
  width: 100%;
  height: 76px;
  background: rgba(250, 247, 245, 0.97);
}

.header-inner {
  height: 100%;
  padding-inline: 5% 7.1%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}

.site-logo {
  display: inline-flex;
  align-items: baseline;
  white-space: nowrap;
  min-width: 0;
  color: #544439;
}

.logo-serif {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: clamp(28px, 2.7vw, 40px);
  line-height: 1;
  letter-spacing: 0.005em;
}

.logo-script {
  font-family: var(--font-script);
  font-size: clamp(34px, 3.35vw, 49px);
  font-weight: 400;
  line-height: 1;
  margin-left: 7px;
  transform: translateY(8px) rotate(-4deg);
}

.main-nav {
  display: flex;
  align-items: center;
  gap: clamp(28px, 5vw, 72px);
  align-self: stretch;
}

.nav-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  position: relative;
  white-space: nowrap;
  font-family: var(--font-serif);
  font-weight: 500;
  font-size: clamp(20px, 1.7vw, 26px);
  letter-spacing: 0.008em;
  transition: color 160ms ease;
}

.nav-link::after {
  content: '';
  position: absolute;
  bottom: -5px;
  left: 0;
  width: 100%;
  height: 1px;
  transform: scaleX(0);
  transform-origin: left;
  background: currentColor;
  transition: transform 180ms ease;
}

.nav-link:hover,
.nav-link:focus-visible {
  color: #8b6b5e;
}

.nav-link:hover::after,
.nav-link.is-current::after {
  transform: scaleX(1);
}

/* ─── Hero ─── */
.hero {
  position: relative;
  height: clamp(510px, 42vw, 675px);
  background: #647b62;
  isolation: isolate;
  z-index: 3;
}

/* 写真の主役（ケーキとラテ）を参考画像に近いサイズへ。
   左端は背景写真を利用し、境界はなめらかにぼかしてつなげる。 */
.hero::before {
  content: '';
  position: absolute;
  z-index: 0;
  inset: 0;
  background: url('pict/top-pict.jpg') right 68% / 81% auto no-repeat;
  -webkit-mask-image: linear-gradient(to right, transparent 0%, transparent 18%, rgba(0,0,0,.3) 27%, black 38%);
  mask-image: linear-gradient(to right, transparent 0%, transparent 18%, rgba(0,0,0,.3) 27%, black 38%);
  pointer-events: none;
}

/* 左端の植物の雰囲気をぼかした写真で自然につなぐ */
.hero::after {
  content: '';
  position: absolute;
  z-index: 0;
  inset: 0;
  background: url('pict/top-pict.jpg') center 68% / cover no-repeat;
  filter: blur(10px);
  -webkit-mask-image: linear-gradient(to right, black 0%, black 18%, transparent 40%);
  mask-image: linear-gradient(to right, black 0%, black 18%, transparent 40%);
  pointer-events: none;
}

.hero-shade {
  position: absolute;
  z-index: 1;
  inset: 0;
  background: linear-gradient(90deg, rgba(20, 22, 18, 0.34) 0%, rgba(25, 27, 22, 0.20) 31%, rgba(26, 27, 22, 0.01) 63%);
  pointer-events: none;
}

.hero-copy {
  position: absolute;
  top: 34.8%;
  left: 7.5%;
  z-index: 2;
  color: #fff;
  text-shadow: 0 2px 9px rgba(36, 28, 23, 0.34);
}

.hero-heading {
  margin: 0;
  font-weight: 400;
}

.hero-serif {
  display: block;
  font-family: var(--font-serif);
  font-size: clamp(57px, 5.1vw, 75px);
  font-weight: 400;
  line-height: 1;
  letter-spacing: 0.01em;
  white-space: nowrap;
}

.hero-script {
  display: block;
  margin-top: 3px;
  padding-left: 1px;
  font-family: var(--font-script);
  font-size: clamp(76px, 7.1vw, 104px);
  font-weight: 400;
  line-height: 0.88;
  transform: rotate(-4deg);
  transform-origin: left center;
}

.hero-caption {
  margin: -5px 0 0;
  padding-top: 9px;
  border-top: 1px solid rgba(255, 255, 255, 0.94);
  width: max-content;
  max-width: 100%;
  font-family: var(--font-japanese);
  font-size: clamp(18px, 1.5vw, 22px);
  font-weight: 400;
  line-height: 1.8;
  letter-spacing: 0.12em;
  white-space: nowrap;
}

.hero-people {
  position: absolute;
  left: 0.7%;
  bottom: -120px;
  z-index: 5;
  display: block;
  width: min(33.2%, 480px);
  height: auto;
  transform-origin: bottom center;
  pointer-events: none;
  user-select: none;
}

/* ─── Wish list / CTA ─── */
.wish-section {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  min-height: 120px;
  padding: 24px 7.1% 24px 5%;
  background: var(--paper);
}

.wish-link {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  width: 53.5%;
  min-height: 72px;
  padding: 15px 65px;
  border-radius: 4px;
  color: #fff;
  background: var(--rose-brown);
  font-family: var(--font-japanese);
  font-weight: 400;
  font-size: clamp(17px, 1.55vw, 23px);
  letter-spacing: 0.09em;
  text-align: center;
  transition: background-color 180ms ease, transform 180ms ease;
}

.wish-link:hover {
  background: var(--rose-brown-hover);
  transform: translateY(-2px);
}

.wish-arrow {
  position: absolute;
  right: 36px;
  top: 50%;
  transform: translateY(-54%);
  font-family: Georgia, serif;
  font-size: 31px;
  font-weight: 400;
  line-height: 1;
}

/* ─── Our Visits / 訪れたお店の記録 ─── */
.coming-section {
  padding: 30px 7.1% 100px 5%;
  background: var(--paper);
  scroll-margin-top: 20px;
}

.visits-heading {
  margin: 0 0 28px;
  padding-bottom: 19px;
  border-bottom: 1px solid #d8c9c0;
}

.visits-heading h2 {
  margin: 0;
  font-family: var(--font-serif);
  font-size: clamp(42px, 4.5vw, 64px);
  font-weight: 400;
  line-height: 1.1;
  letter-spacing: .015em;
}

.visits-heading p {
  margin: 8px 0 0;
  color: #9d8a80;
  font-family: var(--font-japanese);
  font-size: 12px;
  line-height: 1.8;
  letter-spacing: .12em;
}

.coming-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 17px;
}

.coming-card {
  display: grid;
  place-items: center;
  min-width: 0;
  aspect-ratio: 1.82 / 1;
  border-radius: 4px;
  font-family: var(--font-serif);
  font-size: clamp(22px, 1.9vw, 29px);
  font-weight: 400;
  color: #fffaf6;
  text-align: center;
  transition: filter 180ms ease, transform 180ms ease;
}

.coming-card:hover {
  filter: brightness(0.93);
  transform: translateY(-3px);
}

.coming-card--one { background: #b7a49b; }
.coming-card--two { background: #c0aaa2; }
.coming-card--three { background: #ac988d; }
.coming-card--four { background: #b8a79f; }

/* 最初のカードは、写真＋店名＋訪問日のセット */
.cafe-entry { min-width: 0; }
.cafe-entry-photo {
  display: block;
  width: 100%;
  aspect-ratio: 1.82 / 1;
  overflow: hidden;
  border-radius: 4px;
  background: #d9c9be;
}
.cafe-entry-photo img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 64%;
  transition: transform 250ms ease;
}
.cafe-entry-photo:hover img { transform: scale(1.035); }
.cafe-entry-name {
  margin: 12px 0 2px;
  font-family: var(--font-serif);
  font-size: clamp(23px, 2vw, 29px);
  font-weight: 400;
  line-height: 1.2;
  letter-spacing: .015em;
}
.cafe-entry-name a:hover { text-decoration: underline; text-underline-offset: 4px; }
.cafe-entry-date {
  margin: 0;
  font-family: var(--font-serif);
  font-size: clamp(16px, 1.3vw, 19px);
  letter-spacing: .08em;
  color: #9c877e;
}
@media (max-width: 900px) {
  .cafe-entry-photo { aspect-ratio: 1.5 / 1; }
}
@media (max-width: 650px) {
  .cafe-entry-photo { aspect-ratio: 1.6 / 1; }
  .cafe-entry-name { font-size: 22px; }
  .cafe-entry-date { font-size: 16px; }
}

/* ─── Footer ─── */
.site-footer {
  padding: 10px 24px 26px;
  color: #9d8a80;
  background: var(--paper);
  font-family: var(--font-serif);
  font-size: 14px;
  letter-spacing: 0.07em;
  text-align: center;
}

/* ─── Tablet ─── */
@media (max-width: 900px) {
  .site-header { height: 72px; }
  .header-inner { padding-inline: 4.5%; }
  .main-nav { gap: 28px; }
  .hero { height: 530px; }
  .hero-copy { top: 28%; left: 7%; }
  .hero-people { width: 49%; bottom: -96px; }
  .wish-section { min-height: 111px; padding-inline: 4.5%; }
  .wish-link { width: 56%; min-height: 64px; padding-inline: 40px; }
  .wish-arrow { right: 20px; font-size: 27px; }
  .coming-section { padding-inline: 4.5%; }
  .coming-grid { gap: 12px; }
  .coming-card { aspect-ratio: 1.5 / 1; font-size: 22px; }
}

/* ─── Smartphone ─── */
@media (max-width: 650px) {
  .site-header { height: 64px; }
  .header-inner { padding-inline: 4.2%; gap: 12px; }
  .logo-serif { font-size: clamp(24px, 5.7vw, 30px); }
  .logo-script { font-size: clamp(29px, 7vw, 37px); margin-left: 5px; transform: translateY(5px) rotate(-5deg); }
  .main-nav { gap: clamp(12px, 3vw, 24px); }
  .nav-link { font-size: clamp(16px, 4vw, 20px); }
  .nav-link::after { bottom: -5px; }

  .hero {
    height: clamp(490px, 128vw, 620px);
    background-position: center 68%;
  }
  .hero::before {
    background-size: auto 100%;
    background-position: 58% center;
    -webkit-mask-image: none;
    mask-image: none;
  }
  .hero::after { display: none; }
  .hero-shade {
    background: linear-gradient(180deg, rgba(28, 24, 22, 0.36) 0%, rgba(29, 25, 22, 0.16) 49%, rgba(22, 21, 19, 0.04) 79%);
  }
  .hero-copy { top: 10%; left: 7%; }
  .hero-serif { font-size: clamp(48px, 10vw, 67px); }
  .hero-script { margin-top: 5px; font-size: clamp(76px, 19vw, 108px); }
  .hero-caption { margin-top: 10px; padding-top: 10px; font-size: clamp(14px, 3.7vw, 19px); letter-spacing: 0.09em; }
  .hero-people {
    width: 55%;
    max-width: 270px;
    height: auto;
    left: 4%;
    bottom: 0;
    transform: none;
  }

  .wish-section { min-height: 111px; padding: 19px 5%; }
  .wish-link { width: 100%; min-height: 68px; padding: 13px 51px 13px 30px; font-size: 17px; }
  .wish-arrow { right: 22px; }

  .coming-section { padding: 18px 5% 60px; }
  .visits-heading { margin-bottom: 22px; padding-bottom: 15px; }
  .visits-heading h2 { font-size: 44px; }
  .visits-heading p { font-size: 11px; }
  .coming-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .coming-card { aspect-ratio: 1.6 / 1; font-size: 23px; }
}

/* Very narrow phones: give the logo and navigation their own breathing room. */
@media (max-width: 380px) {
  .site-header { height: auto; }
  .header-inner { flex-direction: column; gap: 4px; padding: 8px 12px 6px; }
  .site-logo { align-self: center; }
  .main-nav { align-self: center; gap: 36px; height: 31px; }
  .nav-link::after { bottom: -4px; }
  .hero { height: 490px; }
  .hero-serif { font-size: 46px; }
  .hero-script { font-size: 70px; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition-duration: 0.01ms !important; }
}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="site-logo" href="index.html" aria-label="Rina & Saki Journal ホーム">
        <span class="logo-serif">Rina &amp; Saki</span>
        <span class="logo-script">Journal</span>
      </a>

      <nav class="main-nav" aria-label="メインナビゲーション">
        <a class="nav-link is-current" href="index.html" aria-current="page">Home</a>
        <a class="nav-link" href="list.html">List</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- メインのカフェ写真：pict/top-pict.jpg（CSSで指定） -->
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-shade" aria-hidden="true"></div>

      <div class="hero-copy">
        <h1 class="hero-heading" id="hero-title">
          <span class="hero-serif">Rina &amp; Saki</span>
          <span class="hero-script">Journal</span>
        </h1>
        <p class="hero-caption">浜松の素敵なお店めぐり</p>
      </div>

      <!-- 透過PNGの人物イラスト：pict/rina-saki.png -->
      <img
        class="hero-people"
        src="pict/rina-saki.png"
        alt="カフェでおしゃべりしながら過ごすRinaとSakiのイラスト"
        width="1254"
        height="780"
      >
    </section>

    <!-- これから行きたいお店 -->
    <section class="wish-section" aria-label="行きたいお店へのリンク">
      <a class="wish-link" href="next.html">
        <span>これから行きたいお店</span>
        <span class="wish-arrow" aria-hidden="true">→</span>
      </a>
    </section>

    <!-- ふたりで訪れたお店の記録 -->
    <section class="coming-section" id="our-visits" aria-labelledby="visits-title">
      <div class="visits-heading">
        <h2 id="visits-title">Our Visits</h2>
        <p>ふたりで行ったお店</p>
      </div>

      <div class="coming-grid">
        <!-- 1軒目：ボヌールコーヒー。写真も店名もクリックで日記へ -->
        <article class="cafe-entry">
          <a class="cafe-entry-photo" href="bonheur.html" aria-label="Bonheur Coffeeのカフェ日記を見る">
            <img src="pict/bonheur/bonheur05.jpg" alt="ボヌールコーヒーで撮ったバスクチーズケーキとラテ" loading="lazy">
          </a>
          <h3 class="cafe-entry-name"><a href="bonheur.html">Bonheur Coffee</a></h3>
          <p class="cafe-entry-date"><time datetime="2026-10-22">2026.10.22</time></p>
        </article>

        <a class="coming-card coming-card--two" href="comingsoon.html" aria-label="Coming Soon 2">
          <span>Coming Soon</span>
        </a>
        <a class="coming-card coming-card--three" href="comingsoon.html" aria-label="Coming Soon 3">
          <span>Coming Soon</span>
        </a>
        <a class="coming-card coming-card--four" href="comingsoon.html" aria-label="Coming Soon 4">
          <span>Coming Soon</span>
        </a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <small>© Rina &amp; Saki Journal</small>
  </footer>
</body>
</html>
